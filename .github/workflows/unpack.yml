name: unpack-zip
on: push
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip the project and commit it
        run: |
          if [ -f mlops-azure-demo.zip ]; then
            unzip -o mlops-azure-demo.zip
            rm mlops-azure-demo.zip
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add -A
            git commit -m "Add the MLOps on Azure demo code"
            git push
          fi
